<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }

    .header {
      background: #293e6b;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 20px; }
    .header-title { font-weight: 600; font-size: 15px; color: #fff; }
    .header-badge {
      margin-left: auto;
      font-size: 11px;
      color: #7eb8ff;
      background: rgba(126,184,255,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a4a;
    }
    .meta-lesson-num { font-size: 12px; color: #888; }
    .meta-title { font-size: 14px; font-weight: 500; margin-top: 2px; }

    .status-bar {
      padding: 8px 16px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .status-dot.api { background: #4ade80; }
    .status-dot.extractor { background: #fbbf24; }

    .mode-buttons {
      display: flex;
      gap: 6px;
      padding: 0 16px;
      margin-bottom: 12px;
    }
    .mode-btn {
      flex: 1;
      padding: 7px 6px;
      font-size: 11px;
      border: 1px solid #3a3a5a;
      border-radius: 8px;
      background: #2a2a4a;
      color: #b0b0b0;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .mode-btn:hover { background: #3a3a6a; color: #e0e0e0; }
    .mode-btn.active {
      background: #293e6b;
      border-color: #7eb8ff;
      color: #7eb8ff;
    }

    .action-group {
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled {
      background: #3a3a5a;
      color: #666;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      padding: 9px;
      border: 1px solid #3a3a5a;
      border-radius: 8px;
      background: transparent;
      color: #b0b0b0;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary:hover { background: #2a2a4a; color: #e0e0e0; }

    .result-area {
      display: none;
      padding: 0 16px 12px;
    }
    .result-box {
      background: #111128;
      border-radius: 8px;
      padding: 14px;
      max-height: 280px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.65;
      color: #d0d0d0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .result-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .result-actions button {
      flex: 1;
      padding: 7px;
      font-size: 11px;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      background: #2a2a4a;
      color: #b0b0b0;
      cursor: pointer;
    }
    .result-actions button:hover {
      background: #3a3a6a;
      color: #e0e0e0;
    }

    .usage-info {
      padding: 4px 16px 8px;
      font-size: 10px;
      color: #666;
      text-align: right;
    }

    .loading {
      padding: 24px 16px;
      text-align: center;
      display: none;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #3a3a5a;
      border-top-color: #7eb8ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 12px; color: #888; }

    .error-msg {
      display: none;
      padding: 8px 16px;
    }
    .error-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #f87171;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #2a2a4a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer a {
      font-size: 11px;
      color: #7eb8ff;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }

    .not-on-site {
      padding: 24px 16px;
      text-align: center;
    }
    .not-on-site p {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">❄️</span>
    <span class="header-title">SnowDigest</span>
    <span class="header-badge" id="courseBadge">—</span>
  </div>

  <!-- Not on ServiceNow University -->
  <div class="not-on-site" id="notOnSite" style="display:none;">
    <p>Navega a una lección en<br><strong>nowlearning.servicenow.com</strong><br>para usar SnowDigest.</p>
  </div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="meta" id="metaSection">
      <div class="meta-lesson-num" id="lessonNum">—</div>
      <div class="meta-title" id="lessonTitle">Detectando contenido...</div>
    </div>

    <div class="status-bar" id="statusBar">
      <span class="status-dot api" id="statusDot"></span>
      <span id="statusText">Modo API (Haiku)</span>
    </div>

    <div class="mode-buttons">
      <button class="mode-btn active" data-mode="resumen">📄 Resumen</button>
      <button class="mode-btn" data-mode="puntos">📋 Puntos clave</button>
      <button class="mode-btn" data-mode="flashcards">🗂 Flashcards</button>
      <button class="mode-btn" data-mode="obsidian">🔮 Obsidian</button>
    </div>

    <div class="action-group" id="actionGroup">
      <button class="btn-primary" id="btnProcess">Resumir sección</button>
      <button class="btn-secondary" id="btnSelection">Resumir texto seleccionado</button>
      <button class="btn-secondary" id="btnClaudeAI" style="display:none;">Abrir en Claude.ai ↗</button>
      <button class="btn-secondary" id="btnCopyPrompt" style="display:none;">Copiar prompt al clipboard</button>
    </div>

    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Generando resumen con Haiku...</div>
    </div>

    <div class="error-msg" id="errorMsg">
      <div class="error-box" id="errorText"></div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="result-box" id="resultText"></div>
      <div class="result-actions">
        <button id="btnCopyResult">📋 Copiar</button>
        <button id="btnCopyMd">📝 Markdown</button>
        <button id="btnNewDigest">🔄 Nuevo</button>
      </div>
    </div>

    <div class="usage-info" id="usageInfo" style="display:none;"></div>
  </div>

  <div class="footer">
    <a href="#" id="linkOptions">⚙ Configuración</a>
    <span style="font-size:10px;color:#555;">v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
